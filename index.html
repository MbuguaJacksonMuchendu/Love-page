<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>I Love You ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at top,#ffe5eb,#ffb8c8 55%,#c91d45);font-family:Georgia,'Times New Roman',serif;color:#a40e2e}.card{width:min(100%,520px);text-align:center;padding:20px 18px 26px;border:2px solid rgba(255,255,255,.8);border-radius:28px;background:rgba(255,245,247,.82);box-shadow:0 16px 50px #7b102b55}.hearts{font-size:25px;letter-spacing:9px;margin:2px 0 12px}.portrait{display:block;width:100%;max-height:66vh;object-fit:cover;object-position:center 30%;border:5px solid white;border-radius:20px;box-shadow:0 6px 22px #9b183c33}.message{font-size:clamp(38px,10vw,62px);font-weight:bold;letter-spacing:1px;margin:18px 0 4px;text-shadow:1px 2px #ffc3d0}.sub{font-size:19px;margin:0 0 16px}.play{border:0;border-radius:999px;padding:14px 24px;background:#c8103b;color:white;font-size:17px;font-weight:bold;box-shadow:0 5px 15px #9d163d44;cursor:pointer}.hint{font:13px Arial,sans-serif;color:#7c1b34;margin:12px 0 4px}.player{width:100%;margin-top:14px;border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:#25000b}.player iframe{width:100%;height:100%;border:0} .player[hidden]{display:none}
</style>
</head>
<body><main class="card"><div class="hearts">♥ ♡ ♥</div><img class="portrait" src="her-photo.jpg" alt="Her photo"><div class="message">I LOVE YOU</div><div class="sub">♥ Forever in my heart ♥</div><button class="play" id="play">▶ Play our song</button><p class="hint">Tap to play the song from 0:22 to 0:45</p><div class="player" id="player" hidden></div></main>
<script>
const button=document.getElementById('play'),player=document.getElementById('player');
button.addEventListener('click',()=>{player.hidden=false;player.innerHTML='<iframe title="YouTube music player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen src="https://www.youtube.com/embed/ZUh93vsSDyI?start=22&end=45&autoplay=1&playsinline=1"></iframe>';button.textContent='♪ Song player';});
</script></body></html>
